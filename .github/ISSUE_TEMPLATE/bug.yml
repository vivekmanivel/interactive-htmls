name: Bug report
description: Something in a tool does not work
labels: [bug]
body:
  - type: input
    id: tool
    attributes:
      label: Tool and version
      description: Shown in the tool's About section
      placeholder: south-london-first-time-buyer-guide v1.0.0
    validations: { required: true }
  - type: textarea
    id: what
    attributes: { label: What happened and what you expected }
    validations: { required: true }
  - type: input
    id: browser
    attributes: { label: Browser and device }
  - type: markdown
    attributes:
      value: "**Please do not include personal information** (address, finances, etc.). Issues are public."
